<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Store</title>
    <style>
        /* This makes the website look nice */
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f9f9f9; color: #333; }
        header { background-color: #1a73e8; color: white; padding: 20px; text-align: center; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; gap: 20px; }
        
        /* This styles each product box */
        .product { background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; overflow: hidden; text-align: center; padding-bottom: 20px; }
        .product img { width: 100%; height: 250px; object-fit: cover; }
        .product h3 { margin: 15px 0 5px; }
        .price { color: #e91e63; font-weight: bold; font-size: 1.2em; margin-bottom: 15px; }
        
        /* The WhatsApp Button */
        .btn { background-color: #25D366; color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; display: inline-block; }
        .btn:hover { background-color: #1ebe5d; }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Store</h1>
        <p>Quality Shoes, Phones, Plates & More!</p>
    </header>

    <div class="container">

        <!-- PRODUCT 1: SHOES -->
        <div class="product">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=300&auto=format&fit=crop" alt="Shoes">
            <h3>Classic Red Sneakers</h3>
            <p class="price">GH₵ 250.00</p>
            <!-- CHANGE THE PHONE NUMBER BELOW TO YOURS -->
            <a href="https://wa.me/233501234567?text=Hello! I want to order the Red Sneakers" class="btn" target="_blank">Order on WhatsApp</a>
        </div>

        <!-- PRODUCT 2: PHONES -->
        <div class="product">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=300&auto=format&fit=crop" alt="Phone">
            <h3>Smartphone Pro Max</h3>
            <p class="price">GH₵ 1,500.00</p>
            <!-- CHANGE THE PHONE NUMBER BELOW TO YOURS -->
            <a href="https://wa.me/233501234567?text=Hello! I want to order the Smartphone" class="btn" target="_blank">Order on WhatsApp</a>
        </div>

        <!-- PRODUCT 3: PLATES -->
        <div class="product">
            <img src="https://images.unsplash.com/photo-1610701596007-11502861dcfa?q=80&w=300&auto=format&fit=crop" alt="Plates">
            <h3>Ceramic Dinner Plates (Set)</h3>
            <p class="price">GH₵ 120.00</p>
            <!-- CHANGE THE PHONE NUMBER BELOW TO YOURS -->
            <a href="https://wa.me/233501234567?text=Hello! I want to order the Plates" class="btn" target="_blank">Order on WhatsApp</a>
        </div>

    </div>

</body>
</html>
